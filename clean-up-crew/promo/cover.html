<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean Up Crew cover (source for cover.png / banner.png)</title>
<!-- Renders the Games grid cover (600x800) or banner (?banner, 1400x500) from the game's stand-in art.
     tools: msedge --headless --screenshot=... --window-size=600,800 http://localhost:5178/clean-up-crew/promo/cover.html -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="../art.js"></script>
<style>
  html, body { margin: 0; }
  body { font-family: Fredoka, system-ui, sans-serif; color: #0B2F57; }
  .c { position: relative; overflow: hidden; background: linear-gradient(180deg, #8ADAF8 0%, #56C1EE 62%, #F3C690 62%, #DDA06A 100%); }
  .a { position: absolute; filter: drop-shadow(0 12px 10px rgba(11,47,87,.28)); }
  .a svg { width: 100%; height: 100%; display: block; }
  h1 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-weight: 700; line-height: .92; letter-spacing: -1px;
    -webkit-text-stroke: 12px #0B2F57; paint-order: stroke fill; color: #fff; text-shadow: 0 9px 0 #0B2F57, 0 16px 26px rgba(11,47,87,.35); }
  h1 .y { color: #FFD12E; }
  .pill { position: absolute; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg,#164A7A,#0B2F57); color: #fff;
    border-radius: 999px; padding: 8px 20px 10px; font-size: 26px; font-weight: 700; box-shadow: 0 6px 0 #07203D; }
  .rug { position: absolute; border-radius: 50%; border: 10px solid #7FD3E6; background: radial-gradient(ellipse at 50% 40%, #FBF1E2, #EBD5B6); }
  .rib { position: absolute; background: #fff; border-radius: 999px; font-weight: 700; text-align: center; box-shadow: 0 6px 0 #B9DCEA; }
</style>
</head>
<body>
<div class="c" id="c"></div>
<script>
  const A = window.CleanUpCrewArt.ART;
  const art = (a) => `<svg viewBox="${a.vb}">${a.body}</svg>`;
  const put = (a, x, y, w, h, r = 0) => `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg)">${art(a)}</div>`;
  const note = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3FD6F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
  const c = document.getElementById('c');
  if (location.search.includes('banner')) {
    c.style.cssText = 'width:1400px;height:500px';
    c.innerHTML = `<div class="rug" style="left:120px;top:360px;width:1160px;height:220px"></div>
      <h1 style="top:150px;left:520px;right:auto;font-size:118px;text-align:left">Clean Up<br><span class="y">Crew</span></h1>
      ${put(A.robot('cheer'), 300, 70, 200, 243)}
      ${put(A.binFront('blocks'), 40, 330, 190, 152)}${put(A.binFront('stuffies'), 1000, 330, 190, 152)}
      ${put(A.teddy('#C98A4B'), 1100, 90, 110, 125, 12)}${put(A.book('#F0558C', 'heart'), 1220, 200, 130, 105, -10)}
      ${put(A.shirt('#1EB7D8'), 80, 110, 120, 109, -14)}${put(A.starBlock('#2CCBEA'), 1230, 40, 100, 100, 10)}
      ${put(A.brick('#E8383D'), 230, 380, 110, 88, 8)}`;
  } else {
    c.style.cssText = 'width:600px;height:800px';
    c.innerHTML = `<div class="rug" style="left:40px;top:600px;width:520px;height:220px"></div>
      <div class="pill" style="left:50%;top:30px;transform:translateX(-50%)">${note}Tots Mots</div>
      <h1 style="top:100px;font-size:108px">Clean Up<br><span class="y">Crew</span></h1>
      <div class="rib" style="left:70px;right:70px;top:338px;font-size:26px;padding:10px 0">Tidy up before the song ends!</div>
      ${put(A.robot('wave'), 200, 410, 200, 243)}
      ${put(A.teddy('#C98A4B'), 40, 420, 120, 136, -12)}${put(A.book('#F0558C', 'heart'), 440, 430, 130, 105, 10)}
      ${put(A.binFront('blocks'), 20, 620, 180, 144)}${put(A.binFront('stuffies'), 210, 640, 180, 144)}${put(A.binFront('clothes'), 400, 620, 180, 144)}
      ${put(A.starBlock('#2CCBEA'), 492, 238, 80, 80, 14)}${put(A.shirt('#FFB000', '#fff'), 30, 270, 100, 91, -16)}`;
  }
</script>
</body>
</html>
